# Audio tap for the hidden level meter (long-press dimmer).
#
# Splits Volumio's output so it still reaches the DAC unchanged AND is copied to
# a fifo the plugin can read. Tapping "volumioalsa" rather than MPD's own fifo
# means everything is captured, Spotify included -- spop plays through librespot,
# which never touches MPD.
#
# NOT installed by default: see contrib/AUDIO_TAP.md. A mistake in this file
# takes the audio output down with it, which is not a fair trade for a beta
# toy, so enabling it is a deliberate step.
#
# Modelled on the same hook mpd_oled uses (asound/volumioalsa.postalsa.5.conf).
# The "7" is the ordering priority; it differs from mpd_oled's 5 only to make
# the clash obvious if both are ever installed -- they both redefine
# pcm.volumioalsa and cannot coexist.

pcm.volumioalsa {
    type plug
    slave.pcm {
        type multi
        slaves {
            a { channels 2 pcm "postalsa" }
            b { channels 2 pcm "retrotunerfifo" }
        }
        bindings {
            0 { slave a channel 0 }
            1 { slave a channel 1 }
            2 { slave b channel 0 }
            3 { slave b channel 1 }
        }
    }
    ttable [
        [ 1 0 1 0 ]   # left  -> a.left,  b.left
        [ 0 1 0 1 ]   # right -> a.right, b.right
    ]
}

pcm.retrotunerfifo {
    type volumiofifo
    fifo "/tmp/retrotuner-audio.fifo"
    format_3 "S16_LE"
}
