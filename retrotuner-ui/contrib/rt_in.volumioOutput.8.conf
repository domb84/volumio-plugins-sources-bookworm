# Audio tap for the hidden level meter (long-press dimmer).
#
# Volumio assembles /etc/asound.conf as a chain of pass-through PCMs:
#
#   default -> volumio -> softvolume -> volumioSoftVol -> postVolume
#           -> volumioOutput -> volumioHw
#
# The filename is <pcm this file defines>.<existing chain point to sit in front
# of>.<priority>.conf, so this defines pcm.rt_in and asks to be inserted ahead
# of volumioOutput: whatever fed volumioOutput (postVolume) is rewired to feed
# rt_in, and rt_in passes audio straight through to volumioOutput.
#
# NOTE: earlier revisions of this file targeted "postalsa", copied from
# mpd_oled. That chain point does not exist in this Volumio version, which is
# why nothing appeared in /etc/asound.conf. Check the chain names in
# /etc/asound.conf before changing the target.
#
# Sitting after postVolume means the tap sees post-software-volume audio, so the
# meter follows the volume control -- which is what you want from a level meter.
#
# NOT installed by default: see contrib/AUDIO_TAP.md.

pcm.rt_in {
    type route
    slave.pcm {
        type multi
        slaves.a.pcm "rt_fifo_fixed"   # rate-converted copy for the meter
        slaves.a.channels 2
        slaves.b.pcm "volumioOutput"   # the real output, untouched
        slaves.b.channels 2
        bindings.0.slave a
        bindings.0.channel 0
        bindings.1.slave a
        bindings.1.channel 1
        bindings.2.slave b
        bindings.2.channel 0
        bindings.3.slave b
        bindings.3.channel 1
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}

# Force a fixed 44100Hz S16_LE stereo feed into the fifo whatever the hardware
# is running at. The meter decodes raw signed 16-bit samples; at 24-bit or
# 96kHz it would be reading noise.
pcm.rt_fifo_fixed {
    type plug
    slave {
        pcm "rt_fifo"
        rate 44100
        format S16_LE
        channels 2
    }
}

pcm.rt_fifo {
    type volumiofifo
    fifo "/tmp/retrotuner-audio.fifo"
    format_3 "S16_LE"
}
