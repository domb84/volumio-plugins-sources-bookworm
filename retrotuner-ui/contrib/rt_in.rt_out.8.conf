# Audio tap for the hidden level meter (long-press dimmer).
#
# Volumio assembles /etc/asound.conf as a chain of pass-through PCMs:
#
#   default -> volumio -> softvolume -> volumioSoftVol -> postVolume
#           -> volumioOutput -> volumioHw
#
# The filename is <inPCM>.<outPCM>.<priority>.conf. alsa_controller splices
# contributions into the chain like this (see internalUpdateALSAConfigFile):
#
#   pcm.<previous outPCM> { type empty; slave.pcm "<this inPCM>" }
#   <this file's contents>
#   ... next contribution, then finally slave.pcm "volumioOutput"
#
# So this file defines pcm.rt_in and hands on to rt_out -- and pcm.rt_out is
# emitted by the generator, not by us. Do not define it here.
#
# Priority sorts DESCENDING, so a higher number sits earlier in the chain
# (nearer the player, further from the hardware).
#
# The plugin's package.json must also set volumio_info.has_alsa_contribution;
# without it the scan skips the plugin and never reads this file.
#
# NOT installed by default: see contrib/AUDIO_TAP.md.

# The entry point must be a plug: it negotiates rate/format/channels with
# whatever opens the device. Without it the route/multi below has to accept the
# client's parameters exactly and the open fails ("failed to open the audio
# output"). Both peppymeter and stylish_player wrap their route this way.
pcm.rt_in {
    type plug
    slave.pcm "rt_duplex"
}

pcm.rt_duplex {
    type route
    slave.pcm {
        type multi
        slaves.a.pcm "rt_fifo_fixed"   # rate-converted copy for the meter
        slaves.a.channels 2
        slaves.b.pcm "rt_out"          # onward down the chain
        slaves.b.channels 2
        bindings.0.slave a
        bindings.0.channel 0
        bindings.1.slave a
        bindings.1.channel 1
        bindings.2.slave b
        bindings.2.channel 0
        bindings.3.slave b
        bindings.3.channel 1
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}

# Force a fixed 44100Hz S16_LE stereo feed into the fifo whatever the hardware
# is running at. The meter decodes raw signed 16-bit samples; at 24-bit or
# 96kHz it would be reading noise.
pcm.rt_fifo_fixed {
    type plug
    slave {
        pcm "rt_fifo"
        rate 44100
        format S16_LE
        channels 2
    }
}

pcm.rt_fifo {
    type volumiofifo
    fifo "/tmp/retrotuner-audio.fifo"
    format_3 "S16_LE"
}
