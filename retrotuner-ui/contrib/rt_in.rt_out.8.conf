# Audio tap for the hidden level meter (long-press dimmer).
#
# Modelled directly on stylish_player's sp_in.sp_out.7.conf, which is the same
# job from the same kind of plugin: tee Volumio's output so it still reaches the
# DAC untouched, and copy it to a fifo something else can read.
#
# Naming is <pcm defined>.<pcm it feeds>.<priority>.conf -- Volumio's
# alsa_controller assembles /etc/asound.conf from these. The 8 keeps it clear of
# peppy (6), stylish_player (7), mpd_oled (5) and fusion (10).
#
# The fifo itself is created by the plugin with mkfifo before this config is
# applied -- volumiofifo does not create it, it only writes to it.
#
# NOT installed by default: see contrib/AUDIO_TAP.md.

pcm.rt_in {
    type plug
    slave.pcm "rt_duplex"
}

pcm.rt_duplex {
    type route
    slave.pcm {
        type multi
        slaves.a.pcm "rt_fifo_fixed"   # rate-converted copy for the meter
        slaves.a.channels 2
        slaves.b.pcm "rt_out"          # the real output, unconverted
        slaves.b.channels 2
        bindings.0.slave a
        bindings.0.channel 0
        bindings.1.slave a
        bindings.1.channel 1
        bindings.2.slave b
        bindings.2.channel 0
        bindings.3.slave b
        bindings.3.channel 1
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}

# Force a fixed 44100Hz S16_LE stereo feed into the fifo whatever the hardware
# is running at. The meter decodes raw signed 16-bit samples; at 24-bit or 96kHz
# it would be reading noise.
pcm.rt_fifo_fixed {
    type plug
    slave {
        pcm "rt_fifo"
        rate 44100
        format S16_LE
        channels 2
    }
}

pcm.rt_fifo {
    type volumiofifo
    fifo "/tmp/retrotuner-audio.fifo"
    format_3 "S16_LE"
}
