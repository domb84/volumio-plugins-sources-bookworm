# cava configuration for the hidden level meter (long-press dimmer).
#
# cava reads the raw PCM tap, runs the FFT, and writes one line of 16 numbers
# per frame. That gives us three things at once:
#
#   * the DSP happens in C, not in python or javascript
#   * cava holds the tap fifo open permanently, so ALSA never blocks on write
#     (an unread fifo fills its 64kB buffer in ~0.37s and stops playback)
#   * it runs as its own service, so restarting the plugin's python service --
#     which happens on every settings save -- cannot interrupt audio
#
# Deliberately minimal. An earlier version of this file set
# "[smoothing] noise_reduction = 40" and every bar stayed at zero with no error
# logged -- that key does not exist in this cava build at all. The authoritative
# reference is the example config the package ships:
#
#   /usr/share/cava/example_files/config
#
# Check a key is there, and what range it takes, before adding it. Nothing here
# is set unless the display depends on it; everything else keeps cava's own
# defaults.

[general]
# Rewritten by index.js from the "Layout" setting -- edit that, not this.
#
# 16 for the full-height layouts (one bar per character column). The split-row
# layouts ask for 32, both channels at 16 bands each, and put one channel on
# each row.
bars = 16
# Must stay in step with FRAME_INTERVAL in includes/level_meter.py: this caps
# how many distinct frames exist, that caps how often we draw one. Raising
# either alone just buys duplicate or dropped frames.
#
# Rewritten by index.js from the "Refresh rate" setting -- edit that, not this,
# or a settings save will overwrite it. This value is the shipped default and
# must match FRAMES_PER_SECOND in includes/level_meter.py.
#
# 60 needs the render-performance work in rpi-lcd-menu. Before it a frame took
# ~14ms to write and 60fps would have spent 84% of wall time mid-render; the
# cursor-home and pulse-timing fixes cut it to ~2.7ms, which leaves real
# headroom.
framerate = 60

[input]
method = fifo
source = /tmp/retrotuner-audio.fifo
# Must match what volumiofifo actually writes -- its format_N keys convert to
# S16_LE, but the rate is whatever the source is playing at.
sample_rate = 44100
sample_bits = 16
channels = 2

[output]
method = raw
raw_target = /tmp/retrotuner-bars
# One line per frame: "3;7;12;16;..." -- one value per bar, which maps straight
# onto the display with no scaling on our side.
#
# Rewritten by index.js from the "Layout" setting. 16 for the full-height
# layouts, which stack both character rows into one bar. The split-row layouts
# use 4: a channel confined to a single row has only four height steps, because
# drawing bars that grow up and bars that grow down needs two glyph sets out of
# the eight CGRAM slots that exist. See SPLIT_LEVELS in includes/level_meter.py.
data_format = ascii
ascii_max_range = 16
# Rewritten by index.js from the "Layout" setting -- edit that, not this.
#
# "stereo" makes cava emit both channels; how they are drawn is then up to the
# renderer. With bars = 16 they mirror around the centre, 8 bands each, which on
# 16 characters reads as two small meters. With bars = 32 the split-row layouts
# give each channel its own row at full width. "mono" spends all 16 bars on the
# whole frequency range instead, low to high, left to right, and is the default
# for that reason.
#
# Note this is the [output] channels, not [input] channels above -- the two keys
# share a name and mean entirely different things, which is why index.js edits
# this file by section rather than by line.
channels = mono
# Only consulted when channels = mono; harmless either way, so it is left set.
mono_option = average
