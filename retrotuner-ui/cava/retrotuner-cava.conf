# cava configuration for the hidden level meter (long-press dimmer).
#
# cava reads the raw PCM tap, runs the FFT, and writes one line of 16 numbers
# per frame. That gives us three things at once:
#
#   * the DSP happens in C, not in python or javascript
#   * cava holds the tap fifo open permanently, so ALSA never blocks on write
#     (an unread fifo fills its 64kB buffer in ~0.37s and stops playback)
#   * it runs as its own service, so restarting the plugin's python service --
#     which happens on every settings save -- cannot interrupt audio
#
# Values are deliberately matched to the display: 16 bars for 16 columns, and
# ascii_max_range 16 for the 16 vertical steps two rows of 8-pixel cells give.

[general]
# One bar per character column on the VFD.
bars = 16
# The display cannot usefully be redrawn faster than this, and every frame
# costs GPIO writes that contend with SPI button polling.
framerate = 20
# Ignore the very bottom of the spectrum; on a 16-step display the rumble
# otherwise pins the lowest bars permanently.
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = fifo
source = /tmp/retrotuner-audio.fifo
# Must match the format the ALSA tap forces (see asound/rt_in.rt_out.8.conf).
sample_rate = 44100
sample_bits = 16
channels = 2

[output]
method = raw
raw_target = /tmp/retrotuner-bars
# One line per frame: "3;7;12;16;9;..." -- 16 values, each 0..16, which maps
# straight onto the display with no scaling needed on our side.
data_format = ascii
ascii_max_range = 16

[smoothing]
# cava's own falloff, so the bars settle rather than flicker. Doing this here
# means no ballistics code on our side.
noise_reduction = 40
