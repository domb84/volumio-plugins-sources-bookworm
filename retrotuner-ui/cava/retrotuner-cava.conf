# cava configuration for the level meter. See NOTES.md ("cava").
#
# framerate, bars, autosens, sensitivity, channels and ascii_max_range are
# rewritten by index.js from the settings page -- edit those, not this file.
#
# Config keys vary by cava build. Check /usr/share/cava/example_files/config
# before adding one: a key this build does not know is ignored silently.

[general]
bars = 16
framerate = 60
# On for the spectrum modes, which want a picture that always fills the display.
# The VU mode turns it off: it normalises the level away. See NOTES.md.
autosens = 1
sensitivity = 100

[input]
method = fifo
source = /tmp/retrotuner-audio.fifo
# The tap converts format but not rate, so this is an assumption: a 48kHz
# stream still analyses, with the bands shifted slightly.
sample_rate = 44100
sample_bits = 16
channels = 2

[output]
method = raw
raw_target = /tmp/retrotuner-bars
# One line per frame: "3;7;12;16;..." -- one value per bar, mapping straight
# onto the display with no scaling on our side.
data_format = ascii
ascii_max_range = 16
# [output] channels, not [input] channels above: same name, different meaning,
# which is why index.js edits this file by section rather than by line.
channels = mono
# Only consulted when channels = mono; harmless otherwise.
mono_option = average
