# cava configuration for the hidden level meter (long-press dimmer).
#
# cava reads the raw PCM tap, runs the FFT, and writes one line of 16 numbers
# per frame. That gives us three things at once:
#
#   * the DSP happens in C, not in python or javascript
#   * cava holds the tap fifo open permanently, so ALSA never blocks on write
#     (an unread fifo fills its 64kB buffer in ~0.37s and stops playback)
#   * it runs as its own service, so restarting the plugin's python service --
#     which happens on every settings save -- cannot interrupt audio
#
# Deliberately minimal. An earlier version of this file set
# "[smoothing] noise_reduction = 40" and every bar stayed at zero with no error
# logged -- that key does not exist in this cava build at all. The authoritative
# reference is the example config the package ships:
#
#   /usr/share/cava/example_files/config
#
# Check a key is there, and what range it takes, before adding it. Nothing here
# is set unless the display depends on it; everything else keeps cava's own
# defaults.

[general]
# One bar per character column on the VFD.
bars = 16
# The display cannot usefully be redrawn faster than this, and every frame costs
# GPIO writes that contend with SPI button polling.
framerate = 20

[input]
method = fifo
source = /tmp/retrotuner-audio.fifo
# Must match what volumiofifo actually writes -- its format_N keys convert to
# S16_LE, but the rate is whatever the source is playing at.
sample_rate = 44100
sample_bits = 16
channels = 2

[output]
method = raw
raw_target = /tmp/retrotuner-bars
# One line per frame: "3;7;12;16;..." -- 16 values, each 0..16, which maps
# straight onto the display with no scaling on our side.
data_format = ascii
ascii_max_range = 16
# cava's default is "stereo", which mirrors the two channels around the centre
# of the display -- 8 bands per channel. On 16 characters that reads as two
# small meters rather than one spectrum. "mono" spends all 16 bars on the whole
# frequency range instead, low to high, left to right.
channels = mono
mono_option = average
