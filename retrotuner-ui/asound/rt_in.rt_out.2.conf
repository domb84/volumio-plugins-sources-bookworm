# Audio tap for the level meter: splits the output into the normal chain plus a
# copy for cava. See NOTES.md ("Audio tap") for why the priority is 2, why
# rt_fifo must not be wrapped in a plug, and what happens if nothing reads the
# fifo.
#
# Defines pcm.rt_in and hands on to rt_out. Do not define pcm.rt_out -- the
# generator emits it.

pcm.rt_in {
    type plug
    slave.pcm {
        type multi
        slaves {
            a { channels 2 pcm "rt_out" }     # onward down the chain
            b { channels 2 pcm "rt_fifo" }    # copy for cava
        }
        bindings {
            0 { slave a channel 0 }
            1 { slave a channel 1 }
            2 { slave b channel 0 }
            3 { slave b channel 1 }
        }
    }
    ttable [
        [ 1 0 1 0 ]   # left  -> a.left,  b.left
        [ 0 1 0 1 ]   # right -> a.right, b.right
    ]
}

# Fed straight from the multi, with no plug in between: a plug here forces a
# rate/format and the two branches then impose contradictory constraints, which
# kills MPD with SIGABRT.
pcm.rt_fifo {
    type volumiofifo
    fifo "/tmp/retrotuner-audio.fifo"
    # The formats this fifo supports, as a list. volumiofifo matches the key by
    # the "format_" prefix alone and ignores the suffix, which exists only
    # because ALSA config has no array syntax -- so the number means nothing and
    # repeating it declares S16_LE more than once. One entry: cava is configured
    # for 16-bit.
    format_1 "S16_LE"
}
