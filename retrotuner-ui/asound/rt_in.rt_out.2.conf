# Audio tap for the level meter: the output chain plus a copy for cava.
# See NOTES.md ("Audio tap"). Do not define pcm.rt_out -- the generator emits it.

pcm.rt_in {
    type plug
    slave.pcm {
        type multi
        slaves {
            a { channels 2 pcm "rt_out" }     # onward down the chain
            b { channels 2 pcm "rt_fifo" }    # copy for cava
        }
        bindings {
            0 { slave a channel 0 }
            1 { slave a channel 1 }
            2 { slave b channel 0 }
            3 { slave b channel 1 }
        }
    }
    ttable [
        [ 1 0 1 0 ]   # left  -> a.left,  b.left
        [ 0 1 0 1 ]   # right -> a.right, b.right
    ]
}

# No plug in front of this: tried twice, breaks playback, and is unnecessary.
pcm.rt_fifo {
    type volumiofifo
    fifo "/tmp/retrotuner-audio.fifo"
    # Accepted formats, as a list. Converts nothing, so this is what cava reads.
    format_1 "S16_LE"
}
