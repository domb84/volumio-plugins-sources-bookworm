# Audio tap for the level meter: splits the output into the normal chain plus a
# copy for cava. See NOTES.md ("Audio tap") for why the priority is 2 and what
# happens if nothing reads the fifo.
#
# Defines pcm.rt_in and hands on to rt_out. Do not define pcm.rt_out -- the
# generator emits it.

pcm.rt_in {
    type plug
    slave.pcm {
        type multi
        slaves {
            a { channels 2 pcm "rt_out" }        # onward, untouched
            b { channels 2 pcm "rt_fifo_16" }    # 16-bit copy for cava
        }
        bindings {
            0 { slave a channel 0 }
            1 { slave a channel 1 }
            2 { slave b channel 0 }
            3 { slave b channel 1 }
        }
    }
    ttable [
        [ 1 0 1 0 ]   # left  -> a.left,  b.left
        [ 0 1 0 1 ]   # right -> a.right, b.right
    ]
}

# Converts for cava only, so branch a keeps the source's native format.
#
# Without this, rt_fifo's single declared format constrains the whole multi --
# a multi's hw_params are the intersection across its slaves -- and rt_in's plug
# quietly downconverts everything, including the DAC path, to 16-bit.
#
# "format" belongs under slave, NOT at the top level of this plug. At the top
# level it constrains the plug's *client* side, which propagates back into the
# multi and collides with branch a: empty intersection, then
#
#   snd1_pcm_hw_param_get_min: Assertion `!snd_interval_empty(i)' failed
#
# and MPD dies with SIGABRT. That is what an earlier revision did.
pcm.rt_fifo_16 {
    type plug
    slave {
        pcm "rt_fifo"
        format S16_LE
        rate 44100
    }
}
