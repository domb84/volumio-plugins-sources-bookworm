# Audio tap for the hidden level meter (long-press dimmer).
#
# Structure follows mpd_oled's asound contribution, which does the same job:
# one "plug" carrying the ttable and wrapping a "multi", rather than a separate
# route layer. The plug also negotiates rate/format with whatever opens the
# device -- without it the open fails with "failed to open the audio output".
#
# Filenames are <inPCM>.<outPCM>.<priority>.conf. alsa_controller splices
# contributions into the chain (see internalUpdateALSAConfigFile) as:
#
#   pcm.<previous outPCM> { type empty; slave.pcm "<this inPCM>" }
#   <this file's contents>
#   ... next contribution, then finally slave.pcm "volumioOutput"
#
# So this defines pcm.rt_in and hands on to rt_out -- pcm.rt_out is emitted by
# the generator, not here. Do not define it.
#
# Priority sorts DESCENDING: a higher number sits earlier in the chain, nearer
# the player. package.json must also set volumio_info.has_alsa_contribution, or
# the scan skips this plugin and never reads the file.
#
# mpd_oled targets "postalsa" and peppy "peppy_out"; neither exists in this
# Volumio version. Check the names in /etc/asound.conf before changing the
# target.
#
# NOTE: the fifo must have a reader at all times. cava (retrotuner-cava.service)
# is that reader. If it stops, the 64kB pipe fills in ~0.37s, ALSA blocks on
# write, and playback stops.

pcm.rt_in {
    type plug
    slave.pcm {
        type multi
        slaves {
            a { channels 2 pcm "rt_out" }          # onward down the chain
            b { channels 2 pcm "rt_fifo_fixed" }   # copy for cava
        }
        bindings {
            0 { slave a channel 0 }
            1 { slave a channel 1 }
            2 { slave b channel 0 }
            3 { slave b channel 1 }
        }
    }
    ttable [
        [ 1 0 1 0 ]   # left  -> a.left,  b.left
        [ 0 1 0 1 ]   # right -> a.right, b.right
    ]
}

# Deliberately unlike mpd_oled, which feeds volumiofifo directly: cava is told
# the stream is 44100/S16_LE/2 in its config, so the tap has to actually be
# that. Without this, a 96kHz or 24-bit track would reach cava at the hardware
# rate and be analysed as noise. stylish_player forces its fifo rate for the
# same reason.
pcm.rt_fifo_fixed {
    type plug
    slave {
        pcm "rt_fifo"
        rate 44100
        format S16_LE
        channels 2
    }
}

pcm.rt_fifo {
    type volumiofifo
    fifo "/tmp/retrotuner-audio.fifo"
    format_3 "S16_LE"
}
